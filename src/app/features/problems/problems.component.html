<div class="min-h-screen bg-gray-50">
  <div class="bg-white border-b border-gray-200 px-6 py-4">
    <div class="flex items-center justify-between max-w-4xl mx-auto">
      <div class="flex items-center gap-4">
        <a routerLink="{{ MapRoutes.dashboard }}" class="">
          <button
            class="flex items-center gap-2 text-gray-700 hover:text-gray-900 cursor-pointer"
          >
            <lucide-icon
              [img]="ChevronLeftIcon"
              [size]="24"
              class="w-5 h-5"
            ></lucide-icon>
            <span class="font-medium">Salir</span>
          </button>
        </a>
      </div>
      <div class="flex items-center gap-2 text-gray-600">
        <lucide-icon
          [img]="ClockIcon"
          [size]="24"
          class="w-5 h-5"
        ></lucide-icon>
        <span class="font-medium"></span>
      </div>
    </div>
  </div>

  <div class="max-w-4xl mx-auto px-6 py-8">
    <div class="text-sm text-gray-500 mb-6">Examen UCR</div>
    <!--Question Card -->
    @if(currentQuestion()){
    <div
      class="bg-white rounded-lg shadow-sm border border-gray-200 overflow-hidden"
    >
      <!--/* Progress Section */-->
      <div class="px-6 py-5 border-b border-gray-200">
        <div class="flex items-center justify-between mb-3">
          <h2 class="text-lg font-semibold text-gray-900">
            {{ currentQuestion()!.title }}
          </h2>
          <span class="text-sm text-gray-600">
            Pregunta currentQuestion + 1 de questions.length
          </span>
        </div>
        <div class="w-full bg-gray-200 rounded-full h-2">
          <div
            class="bg-indigo-600 h-2 rounded-full transition-all duration-300"
          >
            <!--width: `${progress}%` -->
          </div>
        </div>
      </div>

      <!--Question Content-->
      <div class="px-6 py-8">
        <h3 class="text-2xl font-bold text-gray-900 mb-8">
          Pregunta {{ currentQuestionIndex() + 1 }}
        </h3>
        <p class="text-lg text-gray-800 mb-8">
          {{ currentQuestion()!.body }}
        </p>
        <!--Options-->
        <div class="space-y-3">
          @for (choice of currentQuestion()!.choices; track choice.id) {
          <label
            class="flex items-center gap-4 p-4 border-2 rounded-lg cursor-pointer transition-all"
            [ngClass]="
              answerText() === choice.choiceText
                ? 'border-indigo-600 bg-indigo-50'
                : 'border-gray-200 hover:border-gray-300 bg-white'
            "
          >
            <input
              type="radio"
              class="w-5 h-5 text-indigo-600 focus:ring-indigo-500"
              [name]="currentQuestion()!.title"
              (change)="handleAnswer(choice)"
            />
            <span class="text-gray-900 font-medium">
              {{ choice.choiceText }}
            </span>
            <span class="text-gray-700"> </span>
          </label>

          }
        </div>
      </div>
      <!--Navigation -->

      <div
        class="px-6 py-4 border-t border-gray-200 flex items-center justify-end bg-gray-50"
      >
        <button
          (click)="nextQuestion()"
          class="x-6 py-2 px-2 text-sm font-medium rounded-lg transition-colors"
          [ngClass]="
            !answerText()
              ? 'bg-gray-300 text-gray-500 cursor-not-allowed'
              : 'bg-indigo-600 text-white hover:bg-indigo-700 cursor-pointer'
          "
        >
          Validar Respuesta
        </button>
      </div>
    </div>
    }
  </div>
</div>
