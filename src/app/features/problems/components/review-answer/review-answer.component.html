<div
  class="px-4 py-4 mt-6 rounded-lg"
  [ngClass]="isCorrect ? 'bg-green-500' : 'bg-red-500'"
>
  <div class="flex items-center gap-3">
    @if(isCorrect){
    <lucide-icon
      [img]="CircleCheckBigIcon"
      [size]="24"
      class="w-8 h-8 text-white"
    ></lucide-icon>
    }@else {

    <lucide-icon
      [img]="CircleXIcon"
      [size]="24"
      class="w-8 h-8 text-white"
    ></lucide-icon>
    }
    <h3 class="text-xl font-bold text-white">
      {{ isCorrect ? "¡Respuesta Correcta!" : "Respuesta Incorrecta" }}
    </h3>
  </div>
</div>

<div class="px-6 py-6">
  <div class="mb-4">
    <p class="text-sm text-gray-600 mb-2">
      <span class="font-semibold">Tu respuesta:</span>
      {{ userAnswer }}
    </p>
    @if(true){
    <p class="text-sm text-gray-600">
      <span class="font-semibold">Respuesta correcta:</span>
      {{ correctAnswer }}
    </p>
    }
  </div>
  <div
    class="p-4 rounded-lg"
    [ngClass]="
      true
        ? 'bg-green-50 border border-green-200'
        : 'bg-red-50 border border-red-200'
    "
  >
    <p
      class="text-sm font-semibold mb-2"
      [ngClass]="true ? 'text-green-900' : 'text-red-900'"
    >
      Explicación:
    </p>

    <p
      class="text-sm leading-relaxed"
      [ngClass]="true ? 'text-green-800' : 'text-red-800'"
    >
      {{ explanation }}
    </p>
  </div>
</div>
