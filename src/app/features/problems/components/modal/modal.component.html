<div class="fixed inset-0 flex items-center justify-center p-4 z-50">
  <div
    class="bg-white rounded-xl shadow-2xl max-w-lg w-full overflow-hidden animate-fadeIn"
  >
    <!--HeaderDelModal-->
    <div
      class="px-6 py-5"
      [ngClass]="isCorrect ? 'bg-green-500' : 'bg-red-500'"
    >
      <div class="flex items-center gap-3">
        @if(isCorrect){
        <lucide-icon
          [img]="CircleCheckBigIcon"
          [size]="24"
          class="w-8 h-8 text-white"
        ></lucide-icon>
        }@else {

        <lucide-icon
          [img]="CircleXIcon"
          [size]="24"
          class="w-8 h-8 text-white"
        ></lucide-icon>
        }
        <h3 class="text-xl font-bold text-white">
          {{ isCorrect ? "¡Respuesta Correcta!" : "Respuesta Incorrecta" }}
        </h3>
      </div>
    </div>
    <!--Contenido del Modal-->
    <div class="px-6 py-6">
      <div class="mb-4">
        <p class="text-sm text-gray-600 mb-2">
          <span class="font-semibold">Tu respuesta:</span> {{ userAnswer }}
        </p>
        @if(!isCorrect){
        <p class="text-sm text-gray-600">
          <span class="font-semibold">Respuesta correcta:</span>
          {{ correctAnswer }}
        </p>
        }
      </div>
      <div
        class="p-4 rounded-lg"
        [ngClass]="
          isCorrect
            ? 'bg-green-50 border border-green-200'
            : 'bg-red-50 border border-red-200'
        "
      >
        <p
          class="text-sm font-semibold mb-2"
          [ngClass]="isCorrect ? 'text-green-900' : 'text-red-900'"
        >
          Explicación:
        </p>

        <p
          class="text-sm leading-relaxed"
          [ngClass]="isCorrect ? 'text-green-800' : 'text-red-800'"
        >
          {{ explanation }}
        </p>
      </div>
    </div>

    <!--Footer-->
    <div
      class="px-6 py-4 bg-gray-50 border-t border-gray-200 flex justify-between"
    >
      <a routerLink="{{ MapRoutes.dashboard }}">
        <button
          class="px-6 py-2.5 text-sm font-medium rounded-lg bg-red-600 text-white hover:bg-red-700 transition-colors cursor-pointer"
        >
          Salir
        </button>
      </a>

      <button
        class="px-6 py-2.5 text-sm font-medium rounded-lg bg-indigo-600 text-white hover:bg-indigo-700 transition-colors cursor-pointer"
        (click)="nextQuestion()"
      >
        ¿Resolver Otra Pregunta?
      </button>
    </div>
  </div>
</div>
