<div class="min-h-screen flex items-center justify-center p-4">
  <div class="bg-white rounded-2xl shadow-2xl max-w-2xl w-full overflow-hidden">
    <!--Header -->
    <div
      class="bg-gradient-to-r from-indigo-600 to-purple-600 px-8 py-12 text-center"
    >
      <div
        class="inline-flex items-center justify-center w-20 h-20 bg-white rounded-full mb-6"
      >
        <lucide-icon
          [img]="CircleCheckBigIcon"
          [size]="24"
          class="w-12 h-12 text-green-500"
        ></lucide-icon>
      </div>
      <h1 class="text-3xl font-bold text-white mb-2">¡Examen Completado!</h1>
      <p class="text-indigo-100 text-lg">Has finalizado todas las preguntas</p>
    </div>
    <!--Resultados-->
    <div class="px-8 py-8">
      <!--Boton-->
      <a routerLink="{{ MapRoutes.dashboard }}" class="">
        <button
          class="w-full px-6 py-4 bg-indigo-600 text-white font-semibold rounded-lg hover:bg-indigo-700 transition-colors shadow-lg hover:shadow-xl cursor-pointer"
        >
          Regresar al Dashboard
        </button>
      </a>
    </div>
  </div>
</div>
