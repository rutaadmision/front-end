<div class="sticky top-0 z-50 h-16 w-full border-b">
  <nav
    class="flex items-center justify-between bg-white shadow-sm px-6 py-3 rounded-xl"
  >
    <div class="flex items-center space-x-2">
      <lucide-icon
        [img]="TargetIcon"
        [size]="24"
        class="h-10 w-10 text-indigo-500"
      ></lucide-icon>
      <span class="font-semibold text-2xl text-gray-1000">Ruta Admisión</span>
    </div>

    <!-- Derecha: enlaces -->
    <div class="flex items-center space-x-6 text-sm text-gray-1000">
      @if (isLogin()) {
      <a routerLink="{{ MapRoutes.dashboard }}" class="">
        <button
          class="px-6 py-3 border-0 rounded-lg text-base cursor-pointer transition-all duration-300 ease-in-out inline-flex items-center gap-2 font-medium hover:text-white hover:bg-[#6366f1]"
          style="border: none"
        >
          <span>Dashboard</span>
        </button>
      </a>

      <button
        class="px-6 py-3 border-0 rounded-lg text-base cursor-pointer transition-all duration-300 ease-in-out inline-flex items-center gap-2 font-medium hover:text-white hover:bg-[#6366f1]"
        style="border: none"
        (click)="logout()"
      >
        <lucide-icon
          [img]="LogOutIcon"
          [size]="10"
          class="h-4 w-4"
        ></lucide-icon>
        Cerrar Sesión
      </button>

      }@else {
      <a routerLink="{{ MapRoutes.home }}" class="">
        <button
          class="px-6 py-3 border-0 rounded-lg text-base cursor-pointer transition-all duration-300 ease-in-out inline-flex items-center gap-2 font-medium hover:text-white hover:bg-[#6366f1]"
          style="border: none"
        >
          <span>Inicio</span>
        </button>
      </a>
      <a routerLink="{{ MapRoutes.login }}" class="">
        <button
          class="px-6 py-3 border-0 rounded-lg text-base cursor-pointer transition-all duration-300 ease-in-out inline-flex items-center gap-2 font-medium hover:text-white hover:bg-[#6366f1]"
          style="border: none"
        >
          <lucide-icon
            [img]="UserIcon"
            [size]="10"
            class="h-4 w-4"
          ></lucide-icon>
          <span>Iniciar sesión</span>
        </button>
      </a>
      }
    </div>
  </nav>
</div>
