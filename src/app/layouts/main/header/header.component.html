<div class="sticky top-0 z-50 h-16 w-full border-b">
  <nav class="flex items-center justify-between bg-white shadow-sm px-6 py-3">
    <div class="flex items-center space-x-2">
      <lucide-icon
        [img]="TargetIcon"
        [size]="24"
        class="h-10 w-10 text-indigo-500"
      ></lucide-icon>
      <span class="font-semibold text-lg text-gray-1000">Ruta Admisión</span>
    </div>

    <!-- Derecha: enlaces -->
    <div class="flex items-center space-x-6 text-sm text-gray-1000">
      <a routerLink="{{ MapRoutes.dashboard }}" class="">
        <button class="btn btn-outline transition" style="border: none">
          Dashboard
        </button>
      </a>

      <button
        class="btn btn-outline transition flex items-center space-x-1"
        style="border: none"
        (click)="test()"
      >
        <lucide-icon
          [img]="LogOutIcon"
          [size]="10"
          class="h-4 w-4"
        ></lucide-icon>
        Cerrar Sesión
      </button>

      <button
        class="flex items-center space-x-1 hover:text-purple-600 transition"
        (click)="test()"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="w-4 h-4"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a2 2 0 01-2 2H5a2 2 0 01-2-2V7a2 2 0 012-2h6a2 2 0 012 2v1"
          />
        </svg>
        <span>Cerrar Sesión</span>
      </button>
    </div>
  </nav>
</div>
